name: IndexNow ping

# Ping IndexNow after every push to main once Vercel has rebuilt the
# production site. We give Vercel ~90s to finish the deploy before
# notifying Bing / Yandex / Naver / Seznam that the site has changed.
#
# Doc: https://www.indexnow.org/documentation
#
# To trigger manually: Actions tab -> IndexNow ping -> Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deploy to settle
        run: sleep 90

      - name: Ping IndexNow via Next.js endpoint
        env:
          # Set this in Settings → Secrets and variables → Actions → Variables.
          # Default to the auto-assigned Vercel production URL so the workflow
          # is useful out of the box; switch to https://novar.gn once a custom
          # domain is wired up.
          SITE_URL: ${{ vars.SITE_URL || 'https://novar-website.vercel.app' }}
        run: |
          echo "Pinging IndexNow on $SITE_URL"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 15 \
            --max-time 60 \
            "$SITE_URL/api/indexnow" || \
          echo "::warning::IndexNow ping failed (non-blocking)"
