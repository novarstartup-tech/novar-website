<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.b{position:relative;width:1024px;height:1024px;overflow:hidden}
.bg{position:absolute;inset:0;background:url('./bg-industrie.png') center/cover no-repeat}
.grad{position:absolute;inset:0;background:linear-gradient(102deg,rgba(4,16,24,.94) 0%,rgba(4,16,24,.72) 28%,rgba(4,16,24,.2) 46%,rgba(4,16,24,0) 60%),linear-gradient(0deg,rgba(4,16,24,.85) 0%,rgba(4,16,24,0) 34%)}
.pad{position:absolute;inset:0;padding:62px 60px;display:flex;flex-direction:column}
.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:#06b6d4;color:#04222b;font-weight:800;font-size:21px;letter-spacing:.05em;padding:10px 18px;border-radius:999px;text-transform:uppercase;box-shadow:0 6px 22px rgba(6,182,212,.35)}
.tag{margin-top:16px;color:#7fe3f2;font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase}
.hook{margin-top:8px;color:#fff;font-weight:800;font-size:70px;line-height:.98;letter-spacing:-.02em;text-shadow:0 3px 22px rgba(0,0,0,.45)}
.hook .c{color:#22d3ee}
.sub{margin-top:18px;max-width:430px;color:#dcecf1;font-weight:500;font-size:25px;line-height:1.32;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.cta{margin-top:26px;display:inline-flex;align-self:flex-start;align-items:center;gap:11px;background:#fff;color:#06323f;font-weight:800;font-size:24px;padding:15px 28px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.cta .a{color:#0891b2;font-size:26px}
.card{position:absolute;right:-70px;bottom:96px;width:660px;border-radius:12px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);transform:perspective(1500px) rotateY(-11deg) rotateX(3deg)}
.tb{display:flex;align-items:center;gap:7px;background:#e9eef2;padding:8px 13px}
.tb i{width:11px;height:11px;border-radius:50%;background:#cbd3d9}
.tb i:nth-child(1){background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840}
.tb span{margin-left:8px;font-size:13px;font-weight:700;color:#5b6b74;letter-spacing:.03em}
.card img{display:block;width:100%}
.badgereal{position:absolute;left:16px;top:14px;z-index:5;background:rgba(6,182,212,.95);color:#04222b;font-weight:800;font-size:13px;letter-spacing:.05em;padding:5px 11px;border-radius:999px;text-transform:uppercase}
.brand{position:absolute;left:60px;bottom:40px;display:flex;align-items:center;gap:10px;z-index:6}
.brand .n{color:#fff;font-weight:800;font-size:25px;letter-spacing:.14em}
.brand .d{width:9px;height:9px;border-radius:50%;background:#22d3ee;box-shadow:0 0 12px #22d3ee}
.brand .p{color:#a9d8e4;font-weight:600;font-size:18px}
</style></head><body>
<div class="b"><div class="bg"></div><div class="grad"></div>
<div class="card"><div class="badgereal">● Vraie capture</div><div class="tb"><i></i><i></i><i></i><span>BIRDY</span></div><img src="./cap-industrie.png"></div>
<div class="pad">
<span class="badge">● 100 % Gratuit</span>
<span class="tag">Industrie · capture réelle</span>
<div class="hook">Sortez<br>du <span class="c">cahier</span>.</div>
<div class="sub">Recettes, ordres de fabrication et coût de revient maîtrisés.</div>
<div class="cta">Télécharger BIRDY <span class="a">→</span></div>
</div>
<div class="brand"><span class="n">NOVAR</span><span class="d"></span><span class="p">novarstartup.com</span></div>
</div></body></html>
