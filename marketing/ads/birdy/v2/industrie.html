<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.b{position:relative;width:1024px;height:1024px;overflow:hidden}
.bg{position:absolute;inset:0;background:url('./bg-industrie.png') center/cover no-repeat}
.grad{position:absolute;inset:0;background:linear-gradient(102deg,rgba(4,16,24,.93) 0%,rgba(4,16,24,.66) 30%,rgba(4,16,24,.12) 50%,rgba(4,16,24,0) 64%),linear-gradient(0deg,rgba(4,16,24,.8) 0%,rgba(4,16,24,0) 30%)}
.pad{position:absolute;inset:0;padding:60px 58px;display:flex;flex-direction:column}
.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:#06b6d4;color:#04222b;font-weight:800;font-size:21px;letter-spacing:.05em;padding:10px 18px;border-radius:999px;text-transform:uppercase;box-shadow:0 6px 22px rgba(6,182,212,.35)}
.tag{margin-top:15px;color:#7fe3f2;font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase}
.hook{margin-top:8px;color:#fff;font-weight:800;font-size:70px;line-height:.98;letter-spacing:-.02em;text-shadow:0 3px 22px rgba(0,0,0,.5)}
.hook .c{color:#22d3ee}
.sub{margin-top:16px;max-width:440px;color:#dcecf1;font-weight:500;font-size:25px;line-height:1.3;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.cta{margin-top:24px;display:inline-flex;align-self:flex-start;align-items:center;gap:11px;background:#fff;color:#06323f;font-weight:800;font-size:23px;padding:14px 26px;border-radius:13px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.cta .a{color:#0891b2;font-size:25px}
.card{position:absolute;left:56px;bottom:44px;width:536px;border-radius:11px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.1);transform:perspective(1500px) rotateY(-7deg) rotateX(2deg)}
.tb{display:flex;align-items:center;gap:6px;background:#e9eef2;padding:7px 12px}
.tb i{width:10px;height:10px;border-radius:50%;background:#cbd3d9}
.tb i:nth-child(1){background:#ff5f57}.tb i:nth-child(2){background:#febc2e}.tb i:nth-child(3){background:#28c840}
.tb span{margin-left:7px;font-size:12px;font-weight:700;color:#5b6b74;letter-spacing:.03em}
.card img{display:block;width:100%}
.badgereal{position:absolute;left:14px;top:12px;z-index:5;background:rgba(6,182,212,.96);color:#04222b;font-weight:800;font-size:12px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.brand{position:absolute;right:56px;bottom:52px;display:flex;align-items:center;gap:9px;z-index:6}
.brand .n{color:#fff;font-weight:800;font-size:24px;letter-spacing:.14em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.brand .d{width:9px;height:9px;border-radius:50%;background:#22d3ee;box-shadow:0 0 12px #22d3ee}
.brand .p{color:#bfe2ec;font-weight:600;font-size:17px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
</style></head><body>
<div class="b"><div class="bg"></div><div class="grad"></div>
<div class="pad">
<span class="badge">● 100 % Gratuit</span>
<span class="tag">Industrie · capture réelle</span>
<div class="hook">Sortez<br>du <span class="c">cahier</span>.</div>
<div class="sub">Recettes, ordres de fabrication et coût de revient maîtrisés.</div>
<div class="cta">Télécharger BIRDY <span class="a">→</span></div>
</div>
<div class="card"><div class="badgereal">● Vraie capture BIRDY</div><div class="tb"><i></i><i></i><i></i><span>BIRDY</span></div><img src="./cap-industrie.png"></div>
<div class="brand"><span class="n">NOVAR</span><span class="d"></span><span class="p">novarstartup.com</span></div>
</div></body></html>
