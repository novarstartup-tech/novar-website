<!doctype html>
<!-- Bannière pub BIRDY — variante SERVICE (1:1, 1024x1024). Fond en chemin relatif. -->
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.banner{position:relative;width:1024px;height:1024px;overflow:hidden;background:#0a141e}
.bg{position:absolute;inset:0;background:url('./birdy-sortez-du-cahier-service-bg.png') center/cover no-repeat}
.grad{position:absolute;inset:0;background:linear-gradient(105deg,rgba(6,17,26,.93) 0%,rgba(6,17,26,.74) 34%,rgba(6,17,26,.2) 52%,rgba(6,17,26,0) 64%)}
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-start;padding:74px 70px}
.badge{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:#06b6d4;color:#04222b;font-weight:800;font-size:22px;letter-spacing:.06em;padding:11px 20px;border-radius:999px;text-transform:uppercase;box-shadow:0 6px 24px rgba(6,182,212,.35)}
.tag{margin-top:18px;align-self:flex-start;color:#7fe3f2;font-weight:700;font-size:20px;letter-spacing:.18em;text-transform:uppercase}
.hook{margin-top:10px;color:#fff;font-weight:800;font-size:88px;line-height:.98;letter-spacing:-.02em;text-shadow:0 3px 24px rgba(0,0,0,.4)}
.hook .c{color:#22d3ee}
.sub{margin-top:24px;max-width:540px;color:#e2eef2;font-weight:500;font-size:30px;line-height:1.32;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.cta{margin-top:40px;display:inline-flex;align-self:flex-start;align-items:center;gap:12px;background:#fff;color:#06323f;font-weight:800;font-size:27px;padding:19px 34px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cta .arw{color:#0891b2;font-size:30px}
.url{margin-top:16px;color:#a9d8e4;font-weight:600;font-size:23px;letter-spacing:.02em}
.brand{position:absolute;left:70px;bottom:54px;display:flex;align-items:center;gap:12px}
.brand .n{color:#fff;font-weight:800;font-size:30px;letter-spacing:.14em}
.brand .dot{width:10px;height:10px;border-radius:50%;background:#22d3ee;box-shadow:0 0 14px #22d3ee}
.brand .p{color:#8fb9c6;font-weight:600;font-size:20px}
</style></head><body>
<div class="banner"><div class="bg"></div><div class="grad"></div>
<div class="content">
<span class="badge">● 100 % Gratuit</span>
<span class="tag">Service · Prestations</span>
<div class="hook">Sortez<br>du <span class="c">cahier</span>.</div>
<div class="sub">Devis, factures et catalogue de prestations — sans gestion de stock, conforme OHADA.</div>
<div class="cta">Télécharger BIRDY <span class="arw">→</span></div>
<div class="url">novarstartup.com</div>
</div>
<div class="brand"><span class="n">NOVAR</span><span class="dot"></span><span class="p">SaaS Studio · Conakry</span></div>
</div></body></html>
